[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "occstress"
version = "0.1.0"
description = "Lightweight protocol validation and count-based scoring for OccStress"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3"]

[project.urls]
Homepage = "https://insailab.org/OccStress/"
Repository = "https://github.com/InSAI-Lab/OccStress"
Issues = "https://github.com/InSAI-Lab/OccStress/issues"
Dataset = "https://huggingface.co/datasets/insailab/OccStress"

[project.optional-dependencies]
construction = ["Pillow>=9", "scipy>=1.9"]
download = ["huggingface-hub>=0.30,<2"]

[tool.setuptools.packages.find]
include = ["occstress*"]
namespaces = false
